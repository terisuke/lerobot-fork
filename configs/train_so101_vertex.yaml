# Training configuration for SO101 robot on Vertex AI
# Dataset: my_so101_dataset_v2
# Task: Pat the head of the person in front of you

training:
  # Dataset will be overridden by command line
  dataset_repo_id: "Terisuke/my_so101_dataset_v2"
  
  # Output will be overridden by command line
  output_dir: "outputs/so101_training"
  
  # Training hyperparameters
  num_epochs: 2000
  batch_size: 8
  learning_rate: 1e-4
  weight_decay: 1e-4
  
  # Checkpointing
  save_checkpoint_steps: 500
  save_checkpoint: true
  
  # Evaluation during training
  eval_steps: 500
  eval_episodes: 5
  
  # Logging
  log_steps: 10
  
  # Resume from checkpoint
  resume: false
  
  # Mixed precision training
  use_amp: true
  
  # Gradient clipping
  grad_clip_norm: 10.0
  
  # Number of data loading workers
  num_workers: 4

# Policy configuration - ACT (Action Chunking Transformer)
policy:
  name: "act"
  
  # Action chunking parameters
  chunk_size: 100
  n_obs_steps: 1
  
  # Vision backbone
  vision_backbone: "resnet18"
  pretrained_backbone: true
  
  # Transformer architecture
  n_encoder_layers: 4
  n_decoder_layers: 1
  n_heads: 8
  dim_feedforward: 3200
  dropout: 0.1
  
  # VAE for action space
  use_vae: true
  latent_dim: 32
  kl_weight: 10.0

# Environment configuration
env:
  name: "so101"
  task: "pat_head"
  fps: 30

# WandB logging (optional)
wandb:
  enable: false
  project: "lerobot-so101-vertex"
  entity: null
  tags:
    - so101
    - vertex-ai
    - act-policy
  notes: "Training SO101 robot to pat head using ACT policy on Vertex AI"

# Optimizer
optimizer:
  name: "adamw"
  lr: 1e-4
  betas: [0.9, 0.999]
  eps: 1e-8
  weight_decay: 1e-4

# Learning rate scheduler
lr_scheduler:
  name: "cosine"
  warmup_steps: 500
  # total_steps will be calculated: num_epochs * steps_per_epoch

# Random seed
seed: 1000
