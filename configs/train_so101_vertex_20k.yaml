# Training configuration for SO101 robot on Vertex AI (Extended - 20K steps)
# Dataset: my_so101_dataset_v2
# Task: Pat the head of the person in front of you
# Previous run (v8): Final loss 0.195 at 10K steps
# Goal: Achieve loss < 0.1

# Dataset configuration
dataset:
  repo_id: "Terisuke/my_so101_dataset_v2"

# Output directory (will be overridden by command line)
output_dir: "outputs/so101_training_20k"

# Training hyperparameters - Extended training
batch_size: 8
steps: 20000  # Increased from 10000
save_checkpoint: true
save_freq: 1000  # Save every 1000 steps
log_freq: 10
eval_freq: 1000  # Evaluate every 1000 steps
num_workers: 4
resume: false

# Policy configuration - ACT (Action Chunking Transformer)
policy:
  type: act
  n_obs_steps: 1
  chunk_size: 100
  n_action_steps: 100
  vision_backbone: resnet18
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  dim_model: 512
  n_heads: 8
  dim_feedforward: 3200
  n_encoder_layers: 4
  n_decoder_layers: 1
  use_vae: true
  latent_dim: 32
  n_vae_encoder_layers: 4
  dropout: 0.1
  kl_weight: 10.0
  optimizer_lr: 1e-4
  optimizer_weight_decay: 1e-4
  optimizer_lr_backbone: 1e-5
  push_to_hub: false

# Environment configuration - set to null to disable gym evaluation
env: null

# WandB logging (optional)
wandb:
  enable: false
  project: "lerobot-so101-vertex"
  entity: null
  notes: "Extended training (20K steps) for SO101 robot to achieve loss < 0.1"

# Use policy training preset (includes optimizer and scheduler)
use_policy_training_preset: true

# Random seed
seed: 1000
